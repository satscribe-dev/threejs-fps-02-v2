<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>CINDERLINE YARD — tactical FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #17120f;
    font-family: "Arial Narrow", Arial, sans-serif; color: #eee; }
  #app, #app canvas { position: absolute; inset: 0; }
  .panel { background: rgba(10, 12, 14, 0.72); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px; padding: 6px 12px; }
  /* minimap */
  #minimap { position: absolute; top: 14px; left: 14px; width: 200px; height: 200px;
    border-radius: 50%; border: 3px solid rgba(255,255,255,0.35); background: rgba(8,10,12,0.7); }
  /* top bar */
  #topbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; }
  #topbar .tb-team { font-size: 22px; letter-spacing: 1px; color: #f0e8d2; }
  #topbar .tb-team b { font-size: 28px; }
  #topbar .tb-team.ember b { color: #e07840; }
  #topbar .tb-team.slate b { color: #6a9ac0; }
  #topbar .tb-mid { text-align: center; font-size: 26px; line-height: 1; color: #fff; }
  #topbar .tb-mid span { display: block; font-size: 11px; letter-spacing: 2px; color: #cbb; margin-top: 2px; }
  /* killfeed */
  #killfeed { position: absolute; top: 14px; right: 14px; text-align: right;
    font-size: 15px; line-height: 1.7; color: #ddd; text-shadow: 0 1px 3px #000; }
  #killfeed div { background: rgba(10,12,14,0.6); padding: 1px 10px; margin-bottom: 3px; border-radius: 3px; }
  /* radio */
  #radio { position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    font-size: 16px; color: #eee; background: rgba(10,12,14,0.72); padding: 5px 14px;
    border-radius: 4px; display: none; }
  #radio.show { display: block; }
  #radio b { color: #e8b83a; margin-right: 8px; }
  /* vitals */
  #vitals { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 8px; }
  #vitals .panel { font-size: 12px; letter-spacing: 2px; color: #cbb; }
  #vitals .panel b { display: block; font-size: 30px; color: #fff; letter-spacing: 0; line-height: 1; }
  #cash b { color: #e8b83a !important; }
  /* weapon */
  /* FIX 9 POIN P3: panel ammo diperkecil ~25% + digeser ke pojok (was
     right/bottom 14px, w-name 20px, ammo 34px) — panel lama menutupi bagian
     bawah frame di area popor viewmodel. Stok senapan sendiri SUDAH di luar
     frame (probe: butt (1302,751)), jadi yang diperbaiki cuma panel DOM. */
  #weaponbox { position: absolute; right: 10px; bottom: 10px; text-align: right; }
  #weaponbox .panel { padding: 4px 9px; }
  #weaponbox .w-name { font-size: 16px; letter-spacing: 1px; }
  #slots { font-size: 11px; color: #bbb; margin: 2px 0; }
  #slots span { margin-left: 8px; padding: 1px 5px; border-radius: 3px; }
  #slots span.on { background: rgba(232,184,58,0.25); color: #e8b83a; }
  #ammo { font-size: 13px; color: #ccc; }
  #ammo b { font-size: 26px; color: #fff; }
  /* crosshair + hitmarker */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff;
    box-shadow: 0 0 3px #000; }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { left: 0; top: 10px; width: 22px; height: 2px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
    transform: translate(-50%, -50%) rotate(45deg); opacity: 0; pointer-events: none; }
  #hitmarker.show { opacity: 1; }
  #hitmarker::before, #hitmarker::after { content: ""; position: absolute; background: #fff; }
  #hitmarker::before { left: 12px; top: 0; width: 2px; height: 26px; }
  #hitmarker::after { left: 0; top: 12px; width: 26px; height: 2px; }
  #dmg { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(200,20,10,0.5) 100%); }
  #dmg.show { opacity: 1; }
  #hint { position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%);
    font-size: 14px; color: #bbb; text-shadow: 0 1px 3px #000; }
  /* plant bar */
  #plantBar { position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
    width: 340px; text-align: center; display: none; }
  #plantBar.show { display: block; }
  #plantBar .plant-label { background: rgba(10,12,14,0.72); padding: 6px 12px; font-size: 17px; }
  #plantBar .plant-track { height: 8px; background: rgba(255,255,255,0.15); margin-top: 4px; }
  #plantBar .plant-fill { height: 100%; width: 0%; background: #e8b83a; }
  #plantBar .plant-hint { font-size: 13px; color: #bbb; margin-top: 4px; text-shadow: 0 1px 3px #000; }
  /* buy menu */
  #buyMenu { position: absolute; inset: 0; background: rgba(8,8,10,0.55); display: none;
    align-items: center; justify-content: center; }
  #buyMenu.show { display: flex; }
  .buy-panel { width: 1060px; max-width: 94vw; background: rgba(14,16,18,0.92);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 22px 26px; }
  .buy-head { display: flex; justify-content: space-between; align-items: baseline; }
  .buy-head h2 { font-size: 30px; letter-spacing: 4px; }
  .buy-head .buy-cash { font-size: 30px; color: #e8b83a; }
  .buy-cols { display: flex; gap: 12px; margin-top: 14px; }
  .buy-col { flex: 1; }
  .buy-col h3 { font-size: 14px; letter-spacing: 2px; color: #bbb; border-bottom: 1px solid #333;
    padding-bottom: 5px; margin-bottom: 8px; }
  .buy-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
  .buy-item b { display: block; font-size: 17px; }
  .buy-item span { color: #e8b83a; font-size: 15px; }
  .buy-item small { display: block; color: #999; font-size: 12px; margin-top: 2px; }
  .buy-item.owned { border-color: rgba(120,200,120,0.5); }
  .buy-item.owned span { color: #7ec87e; }
  .buy-item.expensive { opacity: 0.55; }
  .buy-item.expensive span { color: #c66; }
  /* scoreboard */
  #scoreboard { position: absolute; inset: 0; background: rgba(8,8,10,0.45); display: none;
    align-items: center; justify-content: center; }
  #scoreboard.show { display: flex; }
  .score-panel { width: 720px; max-width: 92vw; background: rgba(14,16,18,0.92);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 24px 30px; }
  .score-panel h2 { text-align: center; font-size: 34px; letter-spacing: 6px; }
  .score-sub { text-align: center; color: #bbb; margin: 6px 0 14px; font-size: 15px; }
  .score-panel h4 { font-size: 17px; letter-spacing: 2px; margin: 12px 0 4px; }
  .score-panel h4.ember { color: #e07840; }
  .score-panel h4.slate { color: #6a9ac0; }
  .score-panel table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .score-panel th { text-align: left; color: #999; font-size: 12px; letter-spacing: 1px;
    border-bottom: 1px solid #333; padding: 3px 4px; }
  .score-panel td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .score-panel tr.you td { color: #e8b83a; }
  /* menu + match end */
  #menu, #matchEnd { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; flex-direction: column; background: rgba(8,8,10,0.5); text-align: center; }
  #menu.show, #matchEnd.show { display: flex; }
  #menu h1 { font-size: 52px; letter-spacing: 8px; }
  #menu p, #matchEnd p { color: #bbb; font-size: 17px; margin-top: 10px; line-height: 1.7; }
  #matchEnd h2 { font-size: 46px; letter-spacing: 8px; }
  #roundEnd { position: absolute; top: 40%; left: 50%; transform: translateX(-50%);
    font-size: 34px; letter-spacing: 5px; display: none; text-shadow: 0 2px 8px #000; }
  #roundEnd.show { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="app"></div>
<canvas id="minimap" width="200" height="200"></canvas>
<div id="topbar"></div>
<div id="killfeed"></div>
<div id="radio"></div>
<div id="vitals">
  <div class="panel" id="health">HEALTH<b>100</b></div>
  <div class="panel" id="armor">ARMOUR<b>100+H</b></div>
  <div class="panel" id="cash">CASH<b>$600</b></div>
</div>
<div id="weaponbox">
  <div class="panel" id="weapon"><span class="w-name">LONGSHOT AR</span>
    <div id="slots"></div>
    <div id="ammo"><b>24</b> / 32</div>
  </div>
</div>
<div id="crosshair"></div>
<div id="hitmarker"></div>
<div id="dmg"></div>
<div id="hint"></div>
<div id="plantBar">
  <div class="plant-label">Arming the charge</div>
  <div class="plant-track"><div class="plant-fill"></div></div>
  <div class="plant-hint">Hold E to arm the charge</div>
</div>
<div id="buyMenu">
  <div class="buy-panel">
    <div class="buy-head"><h2>REQUISITION</h2><span class="buy-cash">$4050</span></div>
    <div class="buy-cols">
      <div class="buy-col"></div><div class="buy-col"></div><div class="buy-col"></div>
      <div class="buy-col"></div><div class="buy-col"></div>
    </div>
  </div>
</div>
<div id="scoreboard"><div class="score-panel"><div class="score-body"></div></div></div>
<div id="menu">
  <h1>CINDERLINE YARD</h1>
  <p>5v5 round-based tactical FPS · dusk rail yard · 12 rounds<br>
  WASD move · Mouse aim · Click shoot · B buy · R reload · Enter start</p>
</div>
<div id="matchEnd"><h2>VICTORY</h2><p></p></div>
<div id="roundEnd"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
